[project]
name = "psage"
version = "0.3.0"
description = "Presupuestador Sage 50 — Genera presupuestos en PDF y Excel a partir de tarifas oficiales"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "gradio==5.23.3",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "reportlab==4.4.10",
    "pywebview==6.2.1",
    "platformdirs==4.11.8"
]

[project.scripts]
psage = "cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["presupuestador", "gradio_app", "simplificar_tarifas", "cli", "models", "tariff_parser", "pdf_generator", "excel_generator", "json_generator", "templates"]
include-package-data = true
