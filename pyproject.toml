[project]
name = "tarifas-sage50"
version = "0.3.0"
description = "Presupuestador Sage 50 — Genera presupuestos en PDF y Excel a partir de tarifas oficiales"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.30.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.0.0",
  "pywebview>=5.0",
]

[project.scripts]
tarifas-sage50 = "cli:main"
tarifas-sage50-gui = "launcher:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["presupuestador", "simplificar_tarifas", "cli", "launcher", "models", "tariff_parser", "pdf_generator", "excel_generator"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["data/*.json", "data/*.xlsx", ".streamlit/*"]
